<?xml version="1.0" encoding="UTF-8"?>
<html xmlns:wicket="http://wicket.apache.org">
<body>
<wicket:panel>
  <dialog wicket:id="dialog" class="dm-drawer-dialog">
    <div class="dm-drawer-panel stack" data-dm-drawer-panel>
      <header class="dm-drawer-header cluster">
        <h2 wicket:id="title" class="dm-drawer-title"></h2>
        <a wicket:id="close" class="dm-drawer-close" aria-label="Close" data-dm-drawer-close><span wicket:id="icon"></span></a>
      </header>
      <div wicket:id="content"></div>
    </div>
  </dialog>
</wicket:panel>
</body>
</html>
