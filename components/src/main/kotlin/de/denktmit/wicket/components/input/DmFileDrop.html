<?xml version="1.0" encoding="UTF-8"?>
<html xmlns:wicket="http://wicket.apache.org">
<body>
<wicket:panel>
  <label class="dm-file-drop-zone" data-dm-file-drop-zone><span wicket:id="icon"></span><span wicket:id="prompt" class="dm-file-drop-prompt"></span><input wicket:id="files" type="file" class="dm-file-drop-input"/></label>
  <ul role="list" class="dm-file-drop-chosen" data-dm-file-drop-chosen></ul>
  <div wicket:id="progress"></div>
  <ul role="list" class="dm-file-drop-uploaded"><li wicket:id="uploaded"><span wicket:id="name"></span></li></ul>
</wicket:panel>
</body>
</html>
