<?xml version="1.0" encoding="UTF-8"?>
<html xmlns:wicket="http://wicket.apache.org">
<body>
<wicket:panel>
  <div wicket:id="tabs-container" class="dm-tab-box-strip">
    <ul role="list" class="dm-tab-box-tabs">
      <li wicket:id="tabs" class="dm-tab"><a href="#" wicket:id="link" class="dm-tab-link"><span wicket:id="title"></span></a><a wicket:id="close" class="dm-tab-close" aria-label="Close tab"><span wicket:id="icon"></span></a></li>
    </ul>
  </div>
  <div class="dm-tab-box-panel" role="tabpanel"><div wicket:id="panel"></div></div>
</wicket:panel>
</body>
</html>
