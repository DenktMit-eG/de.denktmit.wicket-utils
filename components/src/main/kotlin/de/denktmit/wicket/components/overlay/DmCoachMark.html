<?xml version="1.0" encoding="UTF-8"?>
<html xmlns:wicket="http://wicket.apache.org">
<body>
<wicket:panel>
  <dialog wicket:id="dialog" class="dm-coach-dialog box stack" aria-labelledby="" data-dm-coach-dialog>
    <header class="cluster"><h3 wicket:id="title"></h3><a wicket:id="close" class="dm-coach-close" aria-label="Leave the tour"><span wicket:id="icon"></span></a></header>
    <p wicket:id="text"></p>
    <footer class="cluster"><span wicket:id="position" class="muted"></span><a wicket:id="back">Back</a><a wicket:id="next">Next</a><a wicket:id="done">Done</a></footer>
  </dialog>
</wicket:panel>
</body>
</html>
