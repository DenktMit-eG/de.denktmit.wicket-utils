<?xml version="1.0" encoding="UTF-8"?>
<html xmlns:wicket="http://wicket.apache.org">
<body>
<wicket:panel>
  <ol class="dm-timeline-list" role="list">
    <li wicket:id="events" class="dm-timeline-event">
      <time wicket:id="time" class="dm-timeline-time"></time>
      <h3 wicket:id="title" class="dm-timeline-title"></h3>
      <div wicket:id="body" class="dm-timeline-body"></div>
    </li>
  </ol>
</wicket:panel>
</body>
</html>
