<?xml version="1.0" encoding="UTF-8"?>
<html xmlns:wicket="http://wicket.apache.org">
<body>
<wicket:panel>
  <p class="dm-list-sorts cluster"><span wicket:id="sorts"><a wicket:id="sort" class="dm-list-sort"><span wicket:id="sortLabel"></span></a></span></p>
  <ul role="list" class="dm-list-items">
    <li wicket:id="items" class="dm-list-item"><h3 wicket:id="group" class="dm-list-group"></h3><a wicket:id="select" class="dm-list-select"><span wicket:id="icon"></span></a><div wicket:id="item" class="dm-list-body"></div></li>
  </ul>
  <p wicket:id="empty" class="dm-list-empty"></p>
  <div wicket:id="pager"></div>
</wicket:panel>
</body>
</html>
