<?xml version="1.0" encoding="UTF-8"?>
<html xmlns:wicket="http://wicket.apache.org">
<body>
<wicket:panel>
  <ol class="dm-step-bar-list" role="list">
    <li wicket:id="steps">
      <span class="dm-step-mark"><span wicket:id="done"></span><span wicket:id="number"></span></span>
      <a wicket:id="link" class="dm-step-label"><span wicket:id="linkLabel"></span></a>
      <span wicket:id="label" class="dm-step-label"></span>
    </li>
  </ol>
</wicket:panel>
</body>
</html>
